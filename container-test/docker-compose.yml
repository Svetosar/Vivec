services:
  vivec:
    build:
      context: ..
      dockerfile: Containerfile
    image: localhost/vivec:0.1.0
    container_name: vivec-container-test
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - vivec.env
    volumes:
      - vivec-test-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  vivec-test-data:
    name: vivec-test-data
