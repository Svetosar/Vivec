services:
  vivec:
    build:
      context: ..
      dockerfile: Containerfile
    image: localhost/vivec:test
    container_name: vivec-container-test
    ports:
      - "127.0.0.1:8081:8080"
    env_file:
      - vivec.env
    volumes:
      - vivec-test-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  vivec-test-data:
    name: vivec-test-data
